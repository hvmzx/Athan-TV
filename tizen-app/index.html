<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#040b12">
    <title>Athan TV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

    <!-- ============================ SETUP ============================ -->
    <section id="screen-setup" class="screen">
        <div class="bg-glow"></div>

        <header class="setup-head">
            <div class="brand">
                <img class="brand-logo" src="logo.png" alt="Athan TV">
                <div>
                    <div class="brand-name">Athan <span>TV</span></div>
                    <div class="brand-sub" data-i18n="brandSub"></div>
                </div>
            </div>
            <div class="steps" id="steps">
                <div class="step" data-step="1"><span>1</span><em data-i18n="stepWelcome"></em></div>
                <div class="step" data-step="2"><span>2</span><em data-i18n="stepCountry"></em></div>
                <div class="step" data-step="3"><span>3</span><em data-i18n="stepMosque"></em></div>
            </div>
        </header>

        <div class="setup-body">
            <!-- Step 1: welcome -->
            <div class="setup-step" id="setup-step-1">
                <div class="setup-intro">
                    <div class="eyebrow" data-i18n="stepWelcome"></div>
                    <h1 data-i18n="setupWelcomeTitle"></h1>
                    <p class="muted" data-i18n="setupWelcomeHelp"></p>
                </div>
                <div class="row-actions welcome-actions">
                    <button id="btn-start" class="btn primary focusable" data-i18n="getStarted"></button>
                    <button id="btn-test-connection" class="btn ghost focusable" data-i18n="testConnection"></button>
                </div>
                <div id="connect-status" class="status-line"></div>
                <p class="hint" data-i18n="setupWelcomeHint"></p>
            </div>

            <!-- Step 2: country -->
            <div class="setup-step hidden" id="setup-step-2">
                <div class="step-head">
                    <div>
                        <div class="eyebrow" data-i18n="stepCountry"></div>
                        <h1 data-i18n="chooseCountry"></h1>
                        <p class="muted" data-i18n="chooseCountryHelp"></p>
                    </div>
                    <button id="btn-back-2" class="btn ghost focusable" data-i18n="back"></button>
                </div>
                <input id="country-filter" class="text-input full focusable" type="text"
                       spellcheck="false" autocomplete="off" autocapitalize="off">
                <div id="country-grid" class="country-grid"></div>
                <div class="row-actions">
                    <button id="btn-toggle-all" class="btn ghost focusable" data-i18n="showAll"></button>
                </div>
            </div>

            <!-- Step 3: mosque -->
            <div class="setup-step hidden" id="setup-step-3">
                <div class="step-head">
                    <div>
                        <div class="eyebrow" data-i18n="stepMosque"></div>
                        <h1 data-i18n="chooseMosque"></h1>
                        <p class="muted" id="search-subtitle"></p>
                    </div>
                    <button id="btn-back-3" class="btn ghost focusable" data-i18n="changeCountry"></button>
                </div>
                <div class="field-row">
                    <input id="mosque-search" class="text-input focusable" type="text"
                           spellcheck="false" autocomplete="off" autocapitalize="off">
                    <button id="btn-search" class="btn primary focusable" data-i18n="search"></button>
                </div>
                <div id="search-status" class="status-line"></div>
                <div id="mosque-results" class="mosque-results"></div>
            </div>
        </div>

        <footer class="setup-foot">
            <span class="dot" id="net-dot"></span>
            <span id="net-label" class="small muted">…</span>
            <span class="spacer"></span>
            <button id="btn-lang-setup" class="btn tiny focusable">EN</button>
            <button id="btn-settings-setup" class="btn tiny ghost focusable" data-i18n="settings"></button>
        </footer>
    </section>

    <!-- ========================== DASHBOARD ========================== -->
    <section id="screen-dashboard" class="screen hidden">
        <div class="dash-glow"></div>
        <div class="dash-pattern" aria-hidden="true"></div>

        <header class="dash-head">
            <div class="mosque-block">
                <div class="mosque-text">
                    <h1 id="mosque-name">—</h1>
                    <div class="mosque-meta">
                        <span id="mosque-city"></span>
                        <span id="mosque-arabic" class="arabic" dir="rtl"></span>
                    </div>
                </div>
            </div>
            <div class="clock-block">
                <div id="clock-time" class="clock-time">--:--</div>
                <div id="clock-date" class="clock-date"></div>
                <div id="clock-hijri" class="clock-hijri"></div>
            </div>
        </header>

        <main class="dash-main">
            <section class="next-card" id="next-card">
                <div class="next-left">
                    <div class="eyebrow" data-i18n="nextPrayer"></div>
                    <div class="next-name-row">
                        <div id="next-name" class="next-name">—</div>
                        <div id="next-day-badge" class="next-day-badge hidden" data-i18n="tomorrow"></div>
                    </div>
                    <div class="next-times">
                        <span class="next-time-item"><span class="muted" data-i18n="adhan"></span> <strong id="next-adhan">--:--</strong></span>
                        <span class="sep">•</span>
                        <span class="next-time-item"><span class="muted" data-i18n="iqama"></span> <strong id="next-iqama">—</strong></span>
                    </div>
                </div>
                <div class="next-right">
                    <div class="eyebrow" data-i18n="in"></div>
                    <div id="next-countdown" class="next-countdown">--:--:--</div>
                </div>
            </section>

            <section id="prayer-grid" class="prayer-grid"></section>

            <section id="jumua-bar" class="jumua-bar hidden">
                <span class="jumua-label" data-i18n="jumua"></span>
                <div id="jumua-times" class="jumua-times"></div>
            </section>
        </main>

        <footer class="dash-foot">
            <div class="spacer"></div>
            <div class="foot-right">
                <button id="btn-settings" class="btn tiny gold focusable" data-i18n="settings"></button>
            </div>
        </footer>
    </section>

    <!-- ========================== SETTINGS ========================== -->
    <div id="overlay-settings" class="overlay hidden">
        <div class="sheet">
            <header class="sheet-head">
                <div>
                    <div class="eyebrow" data-i18n="configure"></div>
                    <h2 data-i18n="settings"></h2>
                </div>
                <button id="btn-close-settings" class="btn ghost focusable" data-i18n="close"></button>
            </header>

            <div class="settings-grid">
                <div class="setting">
                    <label data-i18n="language"></label>
                    <div class="seg">
                        <button class="seg-btn focusable" data-lang="fr">Français</button>
                        <button class="seg-btn focusable" data-lang="en">English</button>
                        <button class="seg-btn focusable" data-lang="ar" dir="rtl">العربية</button>
                    </div>
                </div>

                <div class="setting">
                    <label data-i18n="notifications"></label>
                    <div class="seg">
                        <button id="toggle-notifications" class="seg-btn focusable">—</button>
                        <button id="btn-test-notification" class="seg-btn focusable" data-i18n="test"></button>
                    </div>
                    <p class="seg-note" data-i18n="notifForegroundNote"></p>
                </div>

                <div class="setting">
                    <label data-i18n="theme"></label>
                    <div class="seg" id="theme-seg">
                        <button class="seg-btn focusable" data-theme="midnight" data-i18n="themeMidnight"></button>
                        <button class="seg-btn focusable" data-theme="emerald" data-i18n="themeEmerald"></button>
                        <button class="seg-btn focusable" data-theme="sapphire" data-i18n="themeSapphire"></button>
                        <button class="seg-btn focusable" data-theme="onyx" data-i18n="themeOnyx"></button>
                        <button class="seg-btn focusable" data-theme="oled" data-i18n="themeOled"></button>
                        <button class="seg-btn focusable" data-theme="ramadan" data-i18n="themeRamadan"></button>
                    </div>
                </div>

                <div class="setting">
                    <label data-i18n="preAlert"></label>
                    <div class="seg" id="prealert-seg">
                        <button class="seg-btn focusable" data-pre="0" data-i18n="off"></button>
                        <button class="seg-btn focusable" data-pre="5">5 min</button>
                        <button class="seg-btn focusable" data-pre="10">10 min</button>
                        <button class="seg-btn focusable" data-pre="15">15 min</button>
                    </div>
                </div>

                <div class="setting">
                    <label data-i18n="sound"></label>
                    <div class="seg">
                        <button id="toggle-sound" class="seg-btn focusable">—</button>
                        <button id="btn-test-sound" class="seg-btn focusable" data-i18n="testSound"></button>
                    </div>
                </div>

                <div class="setting">
                    <label data-i18n="voice"></label>
                    <div class="seg">
                        <button id="toggle-voice" class="seg-btn focusable">—</button>
                    </div>
                </div>

                <div class="setting wide">
                    <label data-i18n="connection"></label>
                    <div class="seg">
                        <span class="seg-note" data-i18n="connectionNote"></span>
                        <button id="btn-test-api" class="seg-btn focusable" data-i18n="test"></button>
                    </div>
                    <div id="settings-test-status" class="status-line"></div>
                </div>

                <div class="setting wide">
                    <label data-i18n="supportTitle"></label>
                    <div class="support-inline">
                        <img class="support-qr" src="assets/donate-qr.png" alt="Mawaqit donation QR code">
                        <div class="support-copy">
                            <p class="support-line" data-i18n="supportText"></p>
                            <p class="support-scan" data-i18n="supportScan"></p>
                            <p class="support-muted" data-i18n="supportThanks"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-actions">
                <button id="btn-change-mosque" class="btn ghost focusable" data-i18n="changeMosque"></button>
            </div>

            <div class="settings-about">
                <span id="about-line"></span>
                <span class="muted"> · </span>
                <span data-i18n="aboutCredit"></span>
            </div>
        </div>
    </div>

    <!-- ======================= PRAYER MOMENT ======================= -->
    <div id="overlay-prayer" class="prayer-overlay hidden">
        <div class="prayer-overlay-glow"></div>
        <div class="prayer-overlay-content">
            <div class="overlay-eyebrow" data-i18n="itIsTime"></div>
            <div id="overlay-prayer-name" class="overlay-prayer-name">—</div>
            <div id="overlay-prayer-time" class="overlay-prayer-time">--:--</div>
            <div id="overlay-iqama" class="overlay-iqama"></div>
            <div class="overlay-mosque" id="overlay-mosque"></div>
            <div class="overlay-hint" data-i18n="pressOk"></div>
        </div>
    </div>

    <div id="toast" class="toast hidden">
        <div id="toast-title" class="toast-title"></div>
        <div id="toast-text" class="toast-text"></div>
    </div>

    <!-- Audio player for adhan notification -->
    <audio id="adhan-player" src="audio/adan.mp3" preload="auto"></audio>
</div>

<script src="js/i18n.js"></script>
<script src="js/countries.js"></script>
<script src="js/mawaqit.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
</body>
</html>
