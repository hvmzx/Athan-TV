name: Build .wgt

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          for file in tizen-app/js/*.js tools/*.js; do
            node --check "$file"
          done

      - name: Build unsigned Tizen widget
        run: node tools/build-wgt.js

      - name: Refresh changelog from conventional commits
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            node tools/changelog.js "${GITHUB_REF_NAME#v}"
          else
            node tools/changelog.js
          fi

      - name: Checksum the package
        run: |
          WGT=dist/AthanTV.wgt
          sha256sum "$WGT" > "$WGT.sha256"
          echo "WGT=$WGT" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: athan-tv-wgt-${{ github.run_number }}
          path: |
            dist/AthanTV.wgt
            dist/AthanTV.wgt.sha256
            CHANGELOG.md
          if-no-files-found: error

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file CHANGELOG.md
          else
            gh release edit "$TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$TAG" dist/AthanTV.wgt dist/AthanTV.wgt.sha256 --clobber
